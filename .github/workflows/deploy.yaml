# Currently, this deploy yaml file builds a Docker image for the dbt project
# - Pushes it to GitHub Container Registry (GHCR)
#   Uses dbt target to decide which schema to deploy:
#   - target=dev → schema=dev
#   - target=prod → schema=prod (if added later)
# - In real-world, PR builds would push :latest to a test/dev environment,
#   while merges to master would push semantic version tags to prod.
# - dbt target is set to dev for all steps.
# Last updated: 2025-12-10

name: Deploy and Test dbt Container

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  dbt:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        ports:
          - 5432:5432
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        options: >-
          --health-cmd "pg_isready -U test_user"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Wait for Postgres
        run: |
          until pg_isready -h localhost -p 5432 -U test_user; do
            echo "Waiting for Postgres..."
            sleep 5
          done

      - name: Export DBT environment variables
        run: |
          echo "DBT_TEST_DBNAME=test_db" >> $GITHUB_ENV
          echo "DBT_TEST_USER=test_user" >> $GITHUB_ENV
          echo "DBT_TEST_PASSWORD=test_password" >> $GITHUB_ENV
          echo "DBT_TEST_HOST=localhost" >> $GITHUB_ENV
          echo "DBT_TEST_PORT=5432" >> $GITHUB_ENV

      - name: Build Docker image
        run: |
          IMAGE=ghcr.io/${{ github.repository }}/dbt-enpal-assessment:latest
          docker build -t $IMAGE .

      - name: Run dbt debug, run, and test inside Docker
        run: |
          IMAGE=ghcr.io/${{ github.repository }}/dbt-enpal-assessment:latest
          docker run --rm \
            -e DBT_TEST_DBNAME="$DBT_TEST_DBNAME" \
            -e DBT_TEST_USER="$DBT_TEST_USER" \
            -e DBT_TEST_PASSWORD="$DBT_TEST_PASSWORD" \
            -e DBT_TEST_HOST="$DBT_TEST_HOST" \
            -e DBT_TEST_PORT="$DBT_TEST_PORT" \
            $IMAGE sh -c "dbt debug --target dev && dbt run --target dev && dbt test --target dev"

      - name: Push Docker image (main repo only)
        if: github.repository == 'your-org/your-repo' && github.event_name == 'push'
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: |
          IMAGE=ghcr.io/${{ github.repository }}/dbt-enpal-assessment:latest
          echo $GHCR_TOKEN | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker push $IMAGE