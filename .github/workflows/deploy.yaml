# Currently, this deploy yaml file builds a Docker image for the dbt project
# - Pushes it to GitHub Container Registry (GHCR)
#   Uses dbt target to decide which schema to deploy:
#   - target=dev → schema=dev
#   - target=prod → schema=prod (if added later)
# - In real-world, PR builds would push :latest to a test/dev environment,
#   while merges to master would push semantic version tags to prod.
# - dbt target is set to dev for all steps.
# Last updated: 2025-12-10

name: Deploy dbt Container

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        ports:
          - 5432:5432
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        options: >-
          --health-cmd "pg_isready -U test_user"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v3

      - name: Build Docker image
        run: |
          IMAGE=ghcr.io/${{ github.repository }}/dbt-enpal-assessment:latest
          docker build -t $IMAGE .

      - name: Run dbt inside Docker
        env:
          DBT_TEST_DBNAME: ${{ secrets.DBT_TEST_DBNAME }}
          DBT_TEST_USER: ${{ secrets.DBT_TEST_USER }}
          DBT_TEST_PASSWORD: ${{ secrets.DBT_TEST_PASSWORD }}
        run: |
          IMAGE=ghcr.io/${{ github.repository }}/dbt-enpal-assessment:latest
          docker run --rm \
            -e DBT_TEST_DBNAME="$DBT_TEST_DBNAME" \
            -e DBT_TEST_USER="$DBT_TEST_USER" \
            -e DBT_TEST_PASSWORD="$DBT_TEST_PASSWORD" \
            $IMAGE dbt debug --target dev