/*------------------------------------------------------------------------------------------------------
  # Currently, this deploy yaml file builds a Docker image for the dbt project
  # - Pushes it to GitHub Container Registry (GHCR)
  #   Uses dbt target to decide which schema to deploy:
  #   - target=dev → schema=dev
  #   - target=prod → schema=prod (if added later)
  # - In real-world, PR builds would push :latest to a test/dev environment,
  #   while merges to master would push semantic version tags to prod.
  # - dbt target is set to dev for all steps.
  # Last updated: 2025-12-09
-----------------------------------------------------------------------------------------------------------*/

name: Build, Push, Deploy Container

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine Docker image tag
        id: docker_tag
        run: |
          # PRs use 'latest', master uses version
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "tag=latest" >> $GITHUB_OUTPUT
          else
            if [ -f VERSION ]; then
              VERSION=$(cat VERSION)
            else
              VERSION="0.1.${GITHUB_RUN_NUMBER}"
            fi
            echo "tag=$VERSION" >> $GITHUB_OUTPUT
          fi

      - name: Build Docker image
        run: |
          IMAGE=ghcr.io/${{ github.repository }}/dbt-enpal-assessment:${{ steps.docker_tag.outputs.tag }}
          docker build -t $IMAGE .

      - name: Push Docker image
        run: |
          IMAGE=ghcr.io/${{ github.repository }}/dbt-enpal-assessment:${{ steps.docker_tag.outputs.tag }}
          docker push $IMAGE

  deploy:
    name: Deploy via dbt (target=dev)
    needs: build-and-push
    uses: ./.github/workflows/deploy_model.yml
    secrets: inherit
    with:
      environment: dev
      DBT_TARGET: dev
      REGISTRY_PATH: ghcr.io/${{ github.repository }}/dbt-enpal-assessment:${{ needs.build-and-push.outputs.docker_tag }}
